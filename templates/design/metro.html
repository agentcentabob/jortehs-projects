<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Departure Board</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/design/metro.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="back-link">← Back</a>
            <h1 class="header" id="h1">Revised Metro Departure Board</h1>
            <div class="station-info" id="stationInfo" style="display: none;">
                <span id="stationName"></span>
                <span id="stationId"></span>
            </div>
            <div class="controls">
                <div class="search-container">
                    <input type="text" id="stopInput" placeholder="Search station by name or enter Stop ID" />
                    <div id="suggestions" class="suggestions-dropdown"></div>
                </div>
                <button id="loadBtn">Load Departures</button>
                <button id="modeToggle">Show Vertical Board</button>
                <button id="refreshBtn">������⟳</button>
            </div>
            <div class="status" id="status"></div>
        </header>

        <div id="standardBoardContainer">
            <div class="board">
                <div class="board-header">
                    <span class="header-left" id="headerLeft"></span>
                    <span class="header-right" id="headerTime"></span>
                </div>
                <div id="departures" class="departures-list">
                    <!-- departures will be inserted here -->
                </div>
            </div>
        </div>

        <div id="verticalBoardContainer" style="display: none;">
            <div class="vertical-board">
                <div class="platform-section" id="platform1Section">
                    <div class="platform-header" id="platform1Header">
                        <span class="header-time" id="platform1HeaderTime"></span>
                        <span class="header-title" id="platform1HeaderTitle">Platform 1</span>
                        <span class="header-arrow" id="platform1HeaderArrow">→</span>
                    </div>
                    <div class="departures-list" id="platform1List"></div>
                </div>
                <div class="platform-section" id="platform2Section">
                    <div class="platform-header" id="platform2Header">
                        <span class="header-arrow" id="platform2HeaderArrow">←</span>
                        <span class="header-title" id="platform2HeaderTitle">Platform 2</span>
                        <span class="header-time" id="platform2HeaderTime"></span>
                    </div>
                    <div class="departures-list" id="platform2List"></div>
                </div>
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <p>Enter a stop ID or search for a station and click "Load Departures" to begin</p>
        </div>
    </div>

    <script type="module" src="/static/js/design/metro.js"></script>
</body>
</html>
