<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Board</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/design/11dat/boardCommon.css">
    <link rel="stylesheet" href="/static/css/design/11dat/vertical.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <a href="/" class="back-link">← Back</a>
                <h1 id="h1">Vertical Board</h1>
                <div class="station-info" id="stationInfo" style="display: none;">
                    <span id="stationName"></span>
                    <span id="stationId"></span>
                </div>
            </div>
            <div class="controls">
                <div class="search-container">
                    <input type="text" id="stopInput" placeholder="Search station by name or enter Stop ID" />
                    <div id="suggestions" class="suggestions-dropdown"></div>
                </div>
                <button id="loadBtn" title="Load Departures">→</button>
                <button id="refreshBtn">⟳</button>
            </div>
            <div class="status" id="status"></div>
        </header>

        <div class="vertical-board" id="verticalBoard">
            <!-- welcome ticker above the top platform - temporary/testing feature -->
            <div class="board-ticker" id="boardTicker"></div>

            <div class="platform-section" id="platform1Section">
                <div class="platform-header platform-header--top">
                    <span class="header-time">
                        <span class="time-label">Time Now</span>
                        <span class="time-value" id="platform1HeaderTime"></span>
                    </span>
                    <div class="header-title-group">
                        <span class="header-title" id="platform1HeaderTitle">Platform –</span>
                        <span class="header-next-stop" id="platform1NextStop"></span>
                    </div>
                    <span class="header-arrow">→</span>
                </div>
                <div class="departures-list" id="platform1List">
                    <p class="no-departures">No information available. Select a valid Metro station.</p>
                </div>
            </div>

            <div class="platform-section" id="platform2Section">
                <div class="platform-header platform-header--bottom">
                    <span class="header-arrow">←</span>
                    <div class="header-title-group">
                        <span class="header-title" id="platform2HeaderTitle">Platform –</span>
                        <span class="header-next-stop" id="platform2NextStop"></span>
                    </div>
                    <span class="header-time">
                        <span class="time-label">Time Now</span>
                        <span class="time-value" id="platform2HeaderTime"></span>
                    </span>
                </div>
                <div class="departures-list" id="platform2List">
                    <p class="no-departures">No information available. Select a valid Metro station.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/design/11dat/vertical.js"></script>
</body>
</html>
