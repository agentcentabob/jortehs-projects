<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/design/11dat/boardCommon.css">
    <link rel="stylesheet" href="/static/css/design/11dat/horizontal.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <a href="/" class="back-link">← Back</a>
                <h1 id="h1">Horizontal Board</h1>
                <div class="station-info" id="stationInfo" style="display: none;">
                    <span id="stationName"></span>
                    <span id="stationId"></span>
                </div>
            </div>
            <div class="controls">
                <div class="search-container">
                    <input type="text" id="stopInput" placeholder="Search station by name or enter Stop ID" />
                    <div id="suggestions" class="suggestions-dropdown"></div>
                </div>
                <div class="platform-toggle" id="platformToggle" style="display: none;"></div>
                <button id="loadBtn" title="Load Departures">→</button>
                <button id="refreshBtn">⟳</button>
            </div>
            <div class="status" id="status"></div>
        </header>

        <div class="board">
            <div class="board-header">
                <span class="header-left" id="headerLeft"></span>
                <span class="header-right" id="headerTime"></span>
            </div>
            <div id="departures" class="departures-list">
                <p class="no-departures">No information available. Select a valid Metro station.</p>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/design/11dat/horizontal.js"></script>
</body>
</html>
