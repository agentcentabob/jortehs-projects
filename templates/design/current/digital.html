<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern departure board design made for digital users. Search by station name or Stop ID for live departures across the whole network">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <title>Digital Board - jorteh's projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/design/current/digital.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <a href="/" class="back-link">← Back</a>
                <h1>Digital Departure Board</h1>
                <div class="station-info" id="stationInfo" style="display: none;">
                    <span id="stationName"></span>
                    <span id="stationId"></span>
                </div>
            </div>
            <div class="controls">
                <div class="search-container">
                    <input type="text" id="stopInput" placeholder="Search station by name or enter Stop ID" />
                    <div id="suggestions" class="suggestions-dropdown"></div>
                </div>
                <button id="loadBtn">Load Departures</button>
                <button id="refreshBtn">Refresh</button>
                <div class="filter-container">
                    <button id="filterBtn" type="button">Filters ▾</button>
                    <div id="filterPanel" class="filter-panel">
                        <label><input type="checkbox" class="mode-checkbox" value="sydneytrains" checked> Sydney Trains</label>
                        <label><input type="checkbox" class="mode-checkbox" value="metro" checked> Metro</label>
                        <label><input type="checkbox" class="mode-checkbox" value="bus" checked> Bus</label>
                        <label><input type="checkbox" class="mode-checkbox" value="lightrail" checked> Light Rail</label>
                        <label><input type="checkbox" class="mode-checkbox" value="ferry" checked> Ferry</label>
                        <label><input type="checkbox" class="mode-checkbox" value="nswtl" checked> Regional/Intercity</label>
                    </div>
                </div>
            </div>
            <div class="status" id="status"></div>
        </header>

        <div class="board">
            <div class="board-header">
                <div class="col-time">Time</div>
                <div class="col-line">Line</div>
                <div class="col-destination">Destination</div>
                <div class="col-platform">Platform</div>
            </div>
            <div id="departures" class="departures-list"></div>
        </div>

        <div class="empty-state" id="emptyState">
            <p>Enter a stop ID or search for a station and click "Load Departures" to begin</p>
        </div>
    </div>

    <script type="module" src="/static/js/design/current/digital.js"></script>
</body>
</html>
